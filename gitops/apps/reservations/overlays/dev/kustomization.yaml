apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reservations-dev
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: reservations-api-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
      - STARTUP_DELAY_MS=1000
      - EXTRA_LATENCY_MS=0
      - ERROR_RATE=0
patches:
  - path: rollout-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: reservations-api
images:
  - name: reservations-api
    newName: reservations-api
    newTag: "1.0.0"
