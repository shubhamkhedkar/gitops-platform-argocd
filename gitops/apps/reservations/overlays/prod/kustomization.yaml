apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reservations-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: reservations-api-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
      - STARTUP_DELAY_MS=0
      - EXTRA_LATENCY_MS=0
      - ERROR_RATE=0
patches:
  - path: rollout-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: reservations-api
  - path: pdb-patch.yaml
images:
  - name: reservations-api
    newName: ghcr.io/shubhamkhedkar/reservations-api
    newTag: "1.0.0"
