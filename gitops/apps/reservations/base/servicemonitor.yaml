apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reservations-api
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reservations-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
